# Single-host production on Fly.io: API over HTTPS + the embedded MQTT broker over TLS.
# Fly terminates TLS for both, so devices connect to mqtts://<app>.fly.dev:8883 with a public
# certificate (Let's Encrypt → put ISRG Root X1 in firmware/certs/ca.pem).
#   fly launch --no-deploy --copy-config --dockerfile apps/backend/Dockerfile
#   fly secrets set MONGO_URI=... JWT_ACCESS_SECRET=... METRICS_TOKEN=...
#   fly deploy
app = "xeno-garden"
primary_region = "sin"

[build]
  dockerfile = "apps/backend/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  MQTT_EMBEDDED = "true"
  MQTT_EMBEDDED_PORT = "1883"
  DEVICE_BROKER_HOST = "xeno-garden.fly.dev"
  DEVICE_BROKER_PORT = "8883"
  DEVICE_BROKER_TLS = "true"
  UPLOAD_DIR = "/data/uploads"

# The embedded broker keeps connections in memory: run exactly one always-on machine.
[[vm]]
  memory = "512mb"

[mounts]
  source = "xg_data"
  destination = "/data"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/v1/health"
    timeout = "5s"

[[services]]
  internal_port = 1883
  protocol = "tcp"
  auto_stop_machines = "off"
  min_machines_running = 1
  [[services.ports]]
    port = 8883
    handlers = ["tls"]
