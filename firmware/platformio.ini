; Xeno Garden v2 firmware — ESP32 (Arduino framework)
; Build:   pio run -e esp32dev -d firmware
; Flash:   pio run -e esp32dev -d firmware -t upload
; Monitor: pio device monitor -d firmware
; Logic tests (host): python firmware/test/run_native.py

[platformio]
default_envs = esp32dev
extra_configs = secrets.ini

[env]
; optional, git-ignored: copy secrets.ini.example → secrets.ini to override build-time defaults
custom_fallback_broker_host =
custom_fallback_broker_port = 1883

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    knolleary/PubSubClient@2.8
    h2zero/NimBLE-Arduino@1.4.3
    adafruit/DHT sensor library@1.4.6
    adafruit/Adafruit Unified Sensor@1.1.14
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DMQTT_MAX_PACKET_SIZE=2048
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
build_unflags = -std=gnu++11
extra_scripts = pre:scripts/embed_config.py
