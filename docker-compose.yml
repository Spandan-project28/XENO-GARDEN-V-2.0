# Local development infrastructure (optional — tests use in-process mongodb-memory-server + aedes instead).
# Start: docker compose up -d
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT (devices, backend, simulator)
      - "9001:9001"   # MQTT over WebSocket
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/mosquitto/passwd:/mosquitto/config/passwd
      - ./infra/mosquitto/acl:/mosquitto/config/acl:ro

volumes:
  mongo-data:
